# Pretrained ResNet18, all layers trained (current best: 67.70% val acc, 67.48% macro F1)
# Run: python -m src.cli train --task classification --config configs/classification_fine_tuning.yaml
task: classification
model: resnet18
mode: fine_tuning          # feature_extraction | fine_tuning
pretrained: true           # ImageNet weights
epochs: 10
batch_size: 32
learning_rate: 0.0001
weight_decay: 0.0
optimizer: adam            # informational; run_experiment uses Adam
seed: 42
num_workers: 2
split_file: outputs/eda/split_indices.json   # 4,795 train / 1,198 val. Do not regenerate.
output_dir: outputs/transfer_learning/fine_tuning
tracking:                 # log this run to MLflow when training finishes
  enabled: true
  dir: outputs/mlflow
  experiment: classification
